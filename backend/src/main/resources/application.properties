# Server Port Configuration

server.port=8081

server.tomcat.connection-timeout=600000

spring.mvc.async.request-timeout=600000


# PostgreSQL Database
# Docker overrides SPRING_DATASOURCE_URL to use the archflow-postgres hostname.

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/archflow}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:archflow}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:StrongPassword123}}
spring.datasource.driver-class-name=org.postgresql.Driver


# JPA / Hibernate Configurations

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true


# JWT
# Secret must be at least 32 characters for HS256.

app.jwt.secret=${JWT_SECRET:ReplaceThisWithALongSecretKeyOfAtLeast32Chars}
app.jwt.expiration-ms=3600000