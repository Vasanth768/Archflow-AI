
# Netlify Configuration for ArchFlow AI

[build]
  base = "client"
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"

# Proxy API requests to the Render backend
[[redirects]]
  from = "/api/*"
  to = "https://archflow-ai-backend.onrender.com/api/:splat"
  status = 200
  force = true

# SPA fallback for React Router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
